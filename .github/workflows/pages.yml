name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/personal-website-design-1jf75a, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no se cancela una en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Sólo se publica el sitio: index.html, assets y .nojekyll.
      # Quedan fuera README, dist (vista previa) y tools.
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: desplegar
        uses: actions/deploy-pages@v4
