<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="ju-title">
  <title id="ju-title">Josefina Urraca — monograma JU sobre pentagrama</title>
  <!-- Fondo papel: el monograma "recorta" el pentagrama mediante un halo del mismo color -->
  <rect width="200" height="200" fill="#efe6d7"/>

  <!-- Pentagrama -->
  <g stroke="#8b2331" stroke-width="3" stroke-linecap="butt">
    <line x1="22" y1="60" x2="178" y2="60"/>
    <line x1="22" y1="78" x2="178" y2="78"/>
    <line x1="22" y1="96" x2="178" y2="96"/>
    <line x1="22" y1="114" x2="178" y2="114"/>
    <line x1="22" y1="132" x2="178" y2="132"/>
  </g>

  <!-- Halo papel (knock-out) -->
  <g fill="none" stroke="#efe6d7" stroke-width="34" stroke-linecap="butt">
    <path d="M78 52 V118 A22 22 0 0 1 34 118"/>
    <path d="M112 52 V118 A27 27 0 0 0 166 118 V52"/>
  </g>

  <!-- Monograma J U -->
  <g fill="none" stroke="#14100e" stroke-width="18" stroke-linecap="butt">
    <path d="M78 52 V118 A22 22 0 0 1 34 118"/>
    <path d="M112 52 V118 A27 27 0 0 0 166 118 V52"/>
  </g>

  <!-- Escuadras: la "caja" (guiño a CreArtBox) -->
  <g fill="none" stroke="#14100e" stroke-width="8" stroke-linecap="butt">
    <path d="M8 46 V8 H46"/>
    <path d="M192 154 V192 H154"/>
  </g>
</svg>
